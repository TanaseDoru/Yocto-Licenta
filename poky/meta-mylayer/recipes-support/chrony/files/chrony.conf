# /etc/chrony.conf — Configurație chrony pentru Raspberry Pi 4B (Yocto/Poky SysVinit)

# Servere NTP publice
pool 0.pool.ntp.org iburst
pool 1.pool.ntp.org iburst
pool 2.pool.ntp.org iburst
pool 3.pool.ntp.org iburst

# Alternativ, servere românești:
# server 0.ro.pool.ntp.org iburst
# server 1.ro.pool.ntp.org iburst

# IMPORTANT: /var/lib/chrony în loc de /var/volatile/lib/chrony
# /var/volatile este specific systemd și trebuie să fie gol în SysVinit
driftfile /var/lib/chrony/drift

# Sare direct la ora corectă dacă diferența e > 1s în primele 3 actualizări
makestep 1.0 3

# Acceptă comenzi chronyc doar local
cmdallow 127.0.0.1
bindcmdaddress 127.0.0.1

# Loguri în /var/log/chrony (nu /var/volatile)
logdir /var/log/chrony
log measurements statistics tracking