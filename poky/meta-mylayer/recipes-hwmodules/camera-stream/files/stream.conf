# camera-stream configuration

# URL endpoint pentru live stream frames
server_stream_url=http://100.125.136.31/stream/push

# URL endpoint pentru snapshot-uri periodice (inlocuieste image-uploader)
server_snapshot_url=http://100.125.136.31/images

# ID device
device_id=rpi4

# Device V4L2
v4l2_dev=/dev/video0

# Rezolutie stream
# RPi Camera Rev 1.3 suporta 30fps la orice rezolutie pana la 1080p
width=640
height=480

# FPS dorit (30 = maxim pentru 640x480)
fps=30

# Interval intre snapshot-uri salvate in DB/galerie (secunde)
# Seteza 0 pentru a dezactiva snapshot-urile
snapshot_interval=30

# JPEG quality (1-100). CPU encoder, not GPU.
# 75 = good quality; lower = smaller frames / more network headroom
jpeg_quality=75

# API key — identica cu API_KEY din docker-compose
api_key=SECRET
