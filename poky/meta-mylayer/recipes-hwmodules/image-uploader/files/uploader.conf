# image-uploader configuration
# Liniile ce incep cu # sunt comentarii

# URL-ul serverului Flask (endpoint /images)
server_url=http://10.10.23.10/images

# ID-ul acestui device (apare in baza de date)
device_id=rpi4

# Device V4L2 pentru camera
v4l2_dev=/dev/video0

# Director unde se salveaza imaginile capturate
capture_dir=/var/lib/image-uploader

# Rezolutie captura
width=1280
height=720

# Interval intre capturi (secunde)
interval=5

# Numar maxim de reincercari la upload
max_retries=3

# Timp de asteptare intre reincercari (secunde)
retry_delay=5
