# BMP180 sensor client configuration
# -----------------------------------

# I2C bus device
I2C_DEV=/dev/i2c-1

# I2C address (BMP180 is always 0x77)
I2C_ADDR=0x77

# Oversampling setting (OSS):
#   0 = ultra low power  (1 sample,  4.5 ms)
#   1 = standard         (2 samples, 7.5 ms)  <-- default
#   2 = high resolution  (4 samples, 13.5 ms)
#   3 = ultra high res   (8 samples, 25.5 ms)
OSS=1